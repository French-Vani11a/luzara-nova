<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Luzara Nova | Admin</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main>
    <h1>Guesses</h1>
    <div class="bar">
      <input id="key" type="password" placeholder="Admin key" autocomplete="off">
      <button id="load" type="button">Load guesses</button>
      <button id="csv" type="button">Download CSV</button>
    </div>
    <p id="msg" role="status"></p>
    <div class="wrap">
      <table id="tbl" hidden>
        <thead><tr><th>#</th><th>Name</th><th>Phone</th><th>Email</th><th>Guess</th><th>Emailed</th><th>Received (UTC)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
